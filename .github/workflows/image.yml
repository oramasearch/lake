name: image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable Docker Hub tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORAMA_SUBMODULES_TOKEN }}

      - name: Resolve image tags
        id: image_tags
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ -z "$REQUESTED_TAG" ]]; then
            echo "An image tag is required." >&2
            exit 1
          fi
          if [[ "${REQUESTED_TAG,,}" == "latest" ]]; then
            echo "The latest tag is forbidden; use an immutable tag." >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "The image tag is not Docker-compatible: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "release=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            oramasearch/lake:${{ steps.image_tags.outputs.release }}
            oramasearch/lake:sha-${{ steps.image_tags.outputs.short_sha }}
