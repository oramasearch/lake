name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lake
          POSTGRES_PASSWORD: lake
          POSTGRES_USER: lake
        options: >-
          --health-cmd "pg_isready -U lake -d lake"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORAMA_SUBMODULES_TOKEN }}

      - name: Restore FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-lake-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Install the Dockerfile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates wget gnupg lsb-release software-properties-common \
            build-essential ninja-build git pkg-config libfuse3-dev fuse3 \
            libstdc++-14-dev zlib1g-dev libssl-dev libpq-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          wget -qO /tmp/cmake.sh https://github.com/Kitware/CMake/releases/download/v3.31.5/cmake-3.31.5-linux-x86_64.sh
          sudo sh /tmp/cmake.sh --skip-license --prefix=/usr/local
          cmake --version

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLAKE_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19

      - name: Build
        run: cmake --build build --parallel

      - name: Apply control-plane schema
        env:
          PGPASSWORD: lake
        run: psql -h 127.0.0.1 -U lake -d lake -f db/schema.sql

      - name: Test
        env:
          LAKE_TEST_DATABASE_URI: postgresql://lake:lake@127.0.0.1:5432/lake
        run: ctest --test-dir build --output-on-failure
