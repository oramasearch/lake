name: ci

# Lake's full suite on Linux (lake#547): every pull request and every push to main builds lake
# with the Dockerfile toolchain and runs all of ctest against a Postgres 16 service and a real
# Zetta binary, the UI token gates included. docs/build/ci.md explains each step.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump ZETTA_REF with the zetta-bridge pin and LIQUID_REF with the liquid-bridge pin.
  # ZETTA_REF is both the client source lake compiles and the server the real-Zetta tests start.
  # Zetta dev 149303c (zetta#1237): lake#543 refuses a Zetta that does not report
  # object_log_prefix_durability.
  ZETTA_REF: 149303c142e0c9ede4ac0c023ae631838140f1bc
  # liquid 93ddcfe (liquid#347): Corosio 0def6d3, the connect-after-open fix (corosio#10).
  LIQUID_REF: 93ddcfe3a44aeeb033414720787130d0cb53df62
  # The Dockerfile's OpenSSL, so CI and the image link the same library; bump both together.
  OPENSSL_VERSION: 3.6.3
  OPENSSL_SHA256: 243a86649cf6f23eeb6a2ff2456e09e5d77dd9018a54d3d96b0c6bdd6ba6c7f1
  CMAKE_VERSION: 3.31.5

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DEBIAN_FRONTEND: noninteractive
      LAKE_INSTANCE_KEK: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      LAKE_TEST_DB_URI: postgresql://postgres:postgres@127.0.0.1:5432/lake_test
      LAKE_TEST_ZETTA_BINARY: ${{ github.workspace }}/_zetta-bin/zetta
      # A Zetta node the step "Start a Zetta node" runs for RequestRecorderZetta and
      # WorkspaceRecordsZetta.
      LAKE_TEST_ZETTA_URL: http://127.0.0.1:48000
      LAKE_TEST_ZETTA_TOKEN: lake-ci-zetta-admin
      # The pinned liquid CLI, Chrome and Puppeteer for InstanceOrigin.BrowserToTerminal.
      LAKE_TEST_LIQUID: ${{ github.workspace }}/_liquid-bin/liquid
      LAKE_TEST_BROWSER: /usr/bin/google-chrome
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: 'true'
      # No CCACHE_BASEDIR: it rewrites __FILE__ to a relative path, and tests find their fixtures
      # next to __FILE__. Every run builds in the same absolute directory, so hits are unaffected.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lake_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Private repositories are read with one read-only deploy key each (secrets DEPLOY_KEY_*,
      # docs/build/ci.md). The ssh agent maps each key to its repository by the key's comment and
      # rewrites both git@ and https:// URLs of those repositories onto it.
      - name: Load the deploy keys
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.DEPLOY_KEY_COROSIO }}
            ${{ secrets.DEPLOY_KEY_BEAST2 }}
            ${{ secrets.DEPLOY_KEY_ORAMACORE_CPP }}
            ${{ secrets.DEPLOY_KEY_AUTOMERGE_CPP }}
            ${{ secrets.DEPLOY_KEY_LIQUID }}
            ${{ secrets.DEPLOY_KEY_ZETTA }}

      - name: Read public GitHub repositories over HTTPS
        # Public submodules named by an ssh URL (oramasearch/http, homer6/automerge-cpp) are read
        # anonymously, not with another repository's deploy key.
        run: |
          git config --global url."https://github.com/oramasearch/http.git".insteadOf "git@github.com:oramasearch/http.git"
          git config --global url."https://github.com/homer6/".insteadOf "git@github.com:homer6/"

      - name: Free disk space
        # The runner starts with about 12 GiB free; lake's build, the caches and the tests' stores need
        # more. These preinstalled toolchains are not used here.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out submodules
        run: git submodule update --init --recursive --depth 1

      - name: Check out the Zetta source
        # Lake compiles only Zetta's client headers, transport and runtime; Zetta's submodules are
        # fetched only when its server binary has to be built (below).
        run: |
          git init -q _external/zetta
          git -C _external/zetta remote add origin git@github.com:oramasearch/zetta.git
          git -C _external/zetta fetch -q --depth 1 origin "$ZETTA_REF"
          git -C _external/zetta checkout -q FETCH_HEAD

      - name: Check out the liquid source
        # liquid is a sibling module of liquid-bridge, not a submodule of lake. The bridge holds
        # the one pin; bump LIQUID_REF when the bridge bumps liquid.
        run: |
          git init -q _external/liquid
          git -C _external/liquid remote add origin git@github.com:oramasearch/liquid.git
          git -C _external/liquid fetch -q --depth 1 origin "$LIQUID_REF"
          git -C _external/liquid checkout -q FETCH_HEAD
          git -C _external/liquid submodule update --init --recursive --depth 1

      - name: Install the Dockerfile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates wget gnupg lsb-release software-properties-common \
            build-essential ninja-build git pkg-config libfuse3-dev fuse3 ccache \
            libstdc++-14-dev zlib1g-dev libssl-dev libpq-dev postgresql-client \
            python3 python3-venv python3-jsonschema
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          wget -qO /tmp/cmake.sh \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh"
          sudo sh /tmp/cmake.sh --skip-license --prefix=/usr/local
          cmake --version
          node --version
          echo "Runner: $(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GiB memory, $(df -h --output=avail . | tail -1) free"
          sudo mkdir -p /opt/openssl
          sudo chown "$USER" /opt/openssl

      # ---- Zetta: the server binary the real-Zetta tests start ---------------------------------
      # Built once per ZETTA_REF and kept in the Actions cache; a hit skips to the lake build.
      # Caches are restored and saved by separate steps so a run whose tests fail still keeps
      # what it built (actions/cache saves only when the whole job succeeds).
      - name: Restore the Zetta binary
        id: zetta_cache
        uses: actions/cache/restore@v4
        with:
          path: _zetta-bin
          key: ${{ runner.os }}-zetta-bin-${{ env.ZETTA_REF }}-clang19-v1

      - name: Install Zetta's build dependencies
        if: steps.zetta_cache.outputs.cache-hit != 'true'
        # Zetta's own image recipe (oramasearch/zetta:dev-*); its binary also links the SDL3 GUI.
        run: |
          sudo apt-get install -y --no-install-recommends \
            lld libc++-19-dev libc++abi-19-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev

      - name: Restore the Zetta compiler cache
        if: steps.zetta_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache-zetta
          key: ${{ runner.os }}-ccache-zetta-${{ env.ZETTA_REF }}
          restore-keys: ${{ runner.os }}-ccache-zetta-

      - name: Build the Zetta binary
        if: steps.zetta_cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-zetta
        run: |
          git -C _external/zetta submodule update --init --recursive --depth 1
          cmake -S _external/zetta -B _external/zetta-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZETTA_BUILD_TESTS=OFF \
            -DZETTA_ENABLE_CUDA=OFF \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build _external/zetta-build --target zetta --parallel
          mkdir -p _zetta-bin
          cp _external/zetta-build/bin/zetta _zetta-bin/zetta
          strip _zetta-bin/zetta || true
          ccache --show-stats
          rm -rf _external/zetta-build

      - name: Save the Zetta binary
        if: steps.zetta_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _zetta-bin
          key: ${{ steps.zetta_cache.outputs.cache-primary-key }}

      - name: Save the Zetta compiler cache
        if: steps.zetta_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache-zetta
          key: ${{ runner.os }}-ccache-zetta-${{ env.ZETTA_REF }}

      - name: Check the Zetta binary
        run: |
          ls -l "$LAKE_TEST_ZETTA_BINARY"
          ldd "$LAKE_TEST_ZETTA_BINARY"

      # ---- Lake --------------------------------------------------------------------------------
      - name: Restore OpenSSL
        id: openssl_cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/openssl
          key: ${{ runner.os }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}

      - name: Build OpenSSL
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        # As the Dockerfile: the build and the tests use OpenSSL 3.6.3, not the runner's 3.0.
        run: |
          wget -qO /tmp/openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  /tmp/openssl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd "/tmp/openssl-${OPENSSL_VERSION}"
          ./Configure linux-x86_64 --prefix=/opt/openssl --libdir=lib64 \
            --openssldir=/etc/ssl shared no-tests
          make -j "$(nproc)"
          make install_sw

      - name: Save OpenSSL
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/openssl
          key: ${{ steps.openssl_cache.outputs.cache-primary-key }}

      - name: Use OpenSSL 3.6.3
        run: |
          LD_LIBRARY_PATH=/opt/openssl/lib64 /opt/openssl/bin/openssl version
          echo "LD_LIBRARY_PATH=/opt/openssl/lib64" >> "$GITHUB_ENV"
          echo "OPENSSL_MODULES=/opt/openssl/lib64/ossl-modules" >> "$GITHUB_ENV"

      - name: Restore FetchContent dependencies
        id: deps_cache
        uses: actions/cache/restore@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-lake-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore the lake compiler cache
        id: lake_ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          # Every run saves its own key; the newest of this branch, else of main, is restored.
          key: ${{ runner.os }}-ccache-lake-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-lake-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-lake-main-
            ${{ runner.os }}-ccache-lake-

      # ---- The liquid CLI: InstanceOrigin.BrowserToTerminal clones and pushes with it ---------
      - name: Restore the liquid CLI
        id: liquid_cache
        uses: actions/cache/restore@v4
        with:
          path: _liquid-bin
          key: ${{ runner.os }}-liquid-cli-${{ env.LIQUID_REF }}-clang19-openssl${{ env.OPENSSL_VERSION }}-v1

      - name: Build the liquid CLI
        if: steps.liquid_cache.outputs.cache-hit != 'true'
        run: |
          cmake -S _external/liquid -B _external/liquid-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIQUID_BUILD_CLI=ON \
            -DLIQUID_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENSSL_ROOT_DIR=/opt/openssl
          cmake --build _external/liquid-build --target liquid-cli --parallel
          mkdir -p _liquid-bin
          cp _external/liquid-build/liquid _liquid-bin/liquid
          rm -rf _external/liquid-build

      - name: Save the liquid CLI
        if: steps.liquid_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _liquid-bin
          key: ${{ steps.liquid_cache.outputs.cache-primary-key }}

      # The web app (frontend/, lake#561) builds with Node 22: its tests run TypeScript directly.
      - name: Set up Node 22 for the web app
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Puppeteer for the browser proof
        # puppeteer-core drives the runner's own Chrome; no browser is downloaded.
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/puppeteer" puppeteer-core@24
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "LAKE_TEST_PUPPETEER=$RUNNER_TEMP/puppeteer/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js" >> "$GITHUB_ENV"
          "$LAKE_TEST_BROWSER" --version
          "$LAKE_TEST_LIQUID" --version || true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLAKE_BUILD_TESTS=ON
          -DPython3_EXECUTABLE=/usr/bin/python3
          -DLAKE_ZETTA_SOURCE_DIR=${{ github.workspace }}/_external/zetta
          -DLAKE_LIQUID_SOURCE_DIR=${{ github.workspace }}/_external/liquid
          -DCMAKE_C_COMPILER=clang-19
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPENSSL_ROOT_DIR=/opt/openssl

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats

      - name: Save the lake compiler cache
        if: always() && steps.lake_ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.lake_ccache.outputs.cache-primary-key }}

      - name: Release build-only disk
        run: |
          rm -rf .ccache .ccache-zetta _external/zetta/modules
          df -h /

      - name: Save FetchContent dependencies
        if: always() && steps.deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/_deps
          key: ${{ steps.deps_cache.outputs.cache-primary-key }}

      - name: Install the Hugging Face client
        run: |
          python3 -m venv .venv-huggingface
          .venv-huggingface/bin/pip install --disable-pip-version-check huggingface_hub==1.30.0
          echo "$GITHUB_WORKSPACE/.venv-huggingface/bin" >> "$GITHUB_PATH"

      - name: Apply the control-plane schema
        run: psql "$LAKE_TEST_DB_URI" --set ON_ERROR_STOP=1 --file db/schema.sql

      - name: Start a Zetta node
        run: |
          mkdir -p "$RUNNER_TEMP/zetta-node"
          "$LAKE_TEST_ZETTA_BINARY" --headless --no-preflight --data-dir "$RUNNER_TEMP/zetta-node/data" \
            --admin-token "$LAKE_TEST_ZETTA_TOKEN" --mcp-listen 127.0.0.1:48000 \
            --listen 127.0.0.1:48001 > "$RUNNER_TEMP/zetta-node/zetta.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "$LAKE_TEST_ZETTA_URL"; then
              echo "Zetta answers at $LAKE_TEST_ZETTA_URL"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/zetta-node/zetta.log"
          exit 1

      - name: Test
        id: test
        # Every ctest test: the token gates (lake-ui-token-gates), the real-Zetta tests
        # (WorkspaceStoreZetta.*) and the rest. A hung test fails by name after five minutes instead
        # of holding the job. The tests that move hundreds of megabytes (HEAVY_TESTS) run one at a
        # time after the others, which run two at a time. A sampler prints memory, swap and free disk
        # into this log every ten seconds, and the tests are the kernel's first choice for an
        # out-of-memory kill (oom_score_adj 1000), so neither exhaustion can take the runner down
        # without a trace.
        env:
          HEAVY_TESTS: '^(RegistryStore\.ALargeLayerIsStreamedNeverHeldWhole|ModelSync\.MultiGigabyteRevisionsDeduplicateAndResumePull)$'
        run: |
          ( while true; do
              echo "[sampler] $(date -u +%H:%M:%S) $(free -m | awk '/Mem:/ {printf "mem_used=%sM mem_avail=%sM", $3, $7} /Swap:/ {printf " swap_used=%sM", $3}') disk_free=$(df -m --output=avail / | tail -1 | tr -d ' ')M top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s=%dM ", $2, $1/1024}')"
              sleep 10
            done ) &
          sampler=$!
          sudo dmesg --clear || true
          echo 1000 > /proc/self/oom_score_adj
          status=0
          ctest --test-dir build --output-on-failure --timeout 300 --parallel 2 -E "$HEAVY_TESTS" \
            --output-junit "${{ github.workspace }}/ctest-results.xml" || status=$?
          ctest --test-dir build --output-on-failure --timeout 600 --parallel 1 -R "$HEAVY_TESTS" \
            --output-junit "${{ github.workspace }}/ctest-results-heavy.xml" || status=$?
          kill "$sampler" || true
          exit "$status"

      - name: Diagnostics
        if: always()
        run: |
          free -m
          df -h / "$RUNNER_TEMP"
          sudo dmesg | grep -iE "oom|killed process|out of memory|no space" | tail -20 || true

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: |
            build/Testing/Temporary/LastTest*.log
            ctest-results*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Report the test counts
        if: always() && steps.test.outcome != 'skipped'
        # Writes the counts to the run summary and fails when a test that must run here did not:
        # without a Zetta binary the real-Zetta tests skip instead of failing.
        shell: python3 {0}
        run: |
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists("ctest-results.xml"):
              print("::error::ctest did not finish, so no test was reported; see the Test step "
                    "and the ctest-log artifact")
              sys.exit(1)
          cases = []
          for result in ("ctest-results.xml", "ctest-results-heavy.xml"):
              if os.path.exists(result):
                  cases += list(ET.parse(result).getroot().iter("testcase"))
          import re
          passed, failed, skipped = [], [], []
          reasons = {}
          for case in cases:
              name = case.get("name")
              output = case.findtext("system-out") or ""
              skip = case.find("skipped")
              reason = re.search(r"Skipped\n(.*)\n", output)
              reasons[name] = (reason.group(1) if reason else
                               (skip.get("message") if skip is not None else "")) or ""
              if case.find("failure") is not None or case.find("error") is not None:
                  failed.append(name)
              elif (case.find("skipped") is not None
                    or case.get("status") in ("notrun", "disabled")
                    or "[  SKIPPED ]" in output):
                  skipped.append(name)
              else:
                  passed.append(name)
          everything = passed + failed + skipped
          zetta = [n for n in everything if n.startswith("WorkspaceStoreZetta.")]
          zetta_ran = [n for n in zetta if n not in skipped]
          gates = "passed" if "lake-ui-token-gates" in passed else "NOT PASSED"
          lines = [
              "## Lake tests on Linux",
              "",
              "| Total | Passed | Failed | Skipped | Real-Zetta tests run | Token gates |",
              "|---|---|---|---|---|---|",
              f"| {len(everything)} | {len(passed)} | {len(failed)} | {len(skipped)} "
              f"| {len(zetta_ran)} of {len(zetta)} | {gates} |",
              "",
          ]
          if failed:
              lines += ["### Failed", ""] + [f"- `{n}`" for n in failed] + [""]
          # A skip whose reason names a missing variable or tool means CI lacks a dependency; the
          # rest skip by design (a parameter that does not apply, a disabled benchmark).
          missing = [n for n in skipped
                     if re.search(r"LAKE_TEST_|not configured|not set|\bSet ", reasons[n])]
          if skipped:
              lines += ["### Skipped", ""] + [
                  f"- `{n}`" + (f": {reasons[n]}" if reasons[n] else "") for n in skipped] + [""]
          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text + "\n")
          problems = []
          if not zetta:
              problems.append("no WorkspaceStoreZetta test is registered")
          # CI supplies everything a test can ask for (Postgres, Zetta, the liquid CLI, a browser).
          if missing:
              problems.append(f"{len(missing)} tests skipped for a missing dependency: "
                              + ", ".join(missing))
          if gates != "passed":
              problems.append("the token gates did not pass")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
